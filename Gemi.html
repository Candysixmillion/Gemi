<script>







  function toggleTextarea() {







    const container = document.getElementById('textareaContainer');







    container.classList.toggle('hidden');







    







    if (!container.classList.contains('hidden')) {







      document.getElementById('systemPrompt').focus();







    }







  }











  function closeTextarea(event) {







    if (event.target === document.getElementById('textareaContainer')) {







      document.getElementById('textareaContainer').classList.add('hidden');







    }







  }

        function transformHistoryForGemini(history) {

                const currentRole = msg.role === 'user' ? 'user' : 'model'; // Map assistant to model

                if (!isNotEmpty) return false; // Skip empty



                if (i === 0) {

                     // First message *must* be user role for the Gemini API contents array

                    return currentRole === 'user';

                }

                 // Keep message if the role is different from the previous one

                return currentRole !== lastRole;

            });





             // Now build the Gemini contents structure

            for (const msg of filteredHistory) {

                 // Map 'assistant' back to 'model' for the API

                const apiRole = msg.role === 'assistant' ? 'model' : msg.role;



                // Skip system messages here, they are handled separately

                 if (apiRole === 'system') continue;



                 // Add the message part

                 geminiContents.push({

                     role: apiRole,

                     parts: [{ text: msg.content }]

                 });

            //     console.warn("History ends with a model message, this might cause issues if not handled.");

            // }



            return geminiContents;

                         // If the cursor was the *only* thing, the text node might become empty.

                         // Marked.parse usually handles empty strings okay, but good to be aware.

                     } else {

                         // Fallback if cursor is part of HTML (less likely with current markdown parsing)

                        contentElement.innerHTML = contentElement.innerHTML.replace(/▋$/, '');

                     }

                 }

             }



             saveChats(); // Save the final state

             scrollToBottom();

            renderChatList();
         }



        // --- EVENT LISTENERS ---

        sendButton.addEventListener('click', handleSendMessage);

        stopButton.addEventListener('click', stopGeneration);

        clearButton.addEventListener('click', clearChat);

        newChatBtn.addEventListener('click', createNewChat);

        sidebarToggle.addEventListener('click', toggleSidebar);



        messageInput.addEventListener('keypress', (e) => {

            if (e.key === 'Enter' && !e.shiftKey) {

                e.preventDefault(); // Prevent newline in textarea

                handleSendMessage();

            }

        });

        messageInput.addEventListener('input', adjustTextareaHeight);



        // Update chat's system prompt when changed in UI

        systemPrompt.addEventListener('change', () => {

            if (currentChatId && chats[currentChatId]) {

                chats[currentChatId].prompt = systemPrompt.value;

                saveChats();

            }

        });



         // Update chat's model when changed in UI

         modelSelect.addEventListener('change', () => {

             if (currentChatId && chats[currentChatId]) {

                 chats[currentChatId].model = modelSelect.value;

                 saveChats();

             }

         });



   




        document.addEventListener('DOMContentLoaded', () => {







            marked.setOptions({ breaks: true, gfm: true });







            loadChats(); removeAllSpans();






            adjustTextareaHeight();







        });




    </script>



</body>
